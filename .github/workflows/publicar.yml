# Publish the short of each slot (12:00 and 19:00 Ecuador) in Spanish and English.
# This repo is public (free Actions minutes); the private data lives in the repo named by vars.DATOS_REPO and is
# checked out into ./datos with secrets.DATOS_PAT. Nothing private is printed: Claude's output goes to datos/registro.
name: Publicar short

on:
  schedule:
    - cron: "33 15 * * *"  # 10:33 Ecuador → franja 12
    - cron: "47 16 * * *"  # respaldo franja 12
    - cron: "33 22 * * *"  # 17:33 Ecuador → franja 19
    - cron: "47 23 * * *"  # respaldo franja 19
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja (12 o 19)"
        default: "12"
      forzar:
        description: "si = publicar aunque la franja ya figure en el registro"
        default: "no"

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRANJA: ${{ github.event.inputs.franja || (contains(github.event.schedule, ' 15 ') || contains(github.event.schedule, ' 16 ')) && '12' || '19' }}
      TZ: America/Guayaquil
      DATOS_REPO: ${{ vars.DATOS_REPO }}
      GH_TOKEN: ${{ secrets.DATOS_PAT }}
      YT_AUDITORIA_OK: ${{ vars.YT_AUDITORIA_OK }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATOS_REPO }}
          token: ${{ secrets.DATOS_PAT }}
          path: datos

      - id: registro
        run: |
          f="datos/registro/$(date +%F).md"
          # the same slot may be woken several times (GitHub cron + cron-job.org): only the first one publishes
          if [ "${{ github.event.inputs.forzar }}" != "si" ] && grep -q "^## Franja ${FRANJA}:00" "$f" 2>/dev/null; then
            echo "hecho=si" >> "$GITHUB_OUTPUT"; echo "La franja $FRANJA ya se publicó hoy."
          fi
          # GitHub sometimes fires a cron hours late: a franja-19 run after midnight would publish as "19:00" of the
          # next day and block that day's real slot. Scheduled runs only count inside their window (Ecuador time).
          h=$((10#$(date +%H)))
          if [ "${{ github.event_name }}" = schedule ] && { { [ "$FRANJA" = 12 ] && [ $h -lt 10 -o $h -ge 17 ]; } || { [ "$FRANJA" = 19 ] && [ $h -lt 17 ]; }; }; then
            echo "hecho=si" >> "$GITHUB_OUTPUT"; echo "Cron retrasado ($h h) fuera de la ventana de la franja $FRANJA: no se publica."
          fi

      - uses: actions/setup-node@v4
        if: steps.registro.outputs.hecho != 'si'
        with:
          node-version: "22"

      - name: Preparar la máquina
        if: steps.registro.outputs.hecho != 'si'
        run: bash automatizacion/setup_ci.sh

      - name: Credenciales
        if: steps.registro.outputs.hecho != 'si'
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          FB_PAGES: ${{ secrets.FB_PAGES }}
        run: |
          mkdir -p credenciales && chmod 700 credenciales
          printf '%s' "$YT_CLIENT_SECRET" > credenciales/youtube_client_secret.json
          [ -z "$YT_TOKEN_ES" ] || printf '%s' "$YT_TOKEN_ES" > credenciales/youtube_token_es.json
          [ -z "$YT_TOKEN_EN" ] || printf '%s' "$YT_TOKEN_EN" > credenciales/youtube_token_en.json
          [ -z "$FB_PAGES" ] || printf '%s' "$FB_PAGES" > credenciales/facebook.json
          chmod 600 credenciales/*

      - name: Claude produce y publica
        if: steps.registro.outputs.hecho != 'si'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          mkdir -p datos/registro/claude
          claude -p "$(cat automatizacion/prompt-diario.md)" \
            --model claude-sonnet-5-5 \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch" \
            --max-turns 200 > "datos/registro/claude/$(date +%F)_$FRANJA.log" 2>&1 \
            && echo "Claude terminó bien" || { echo "::error::Claude falló (detalle en el registro privado)"; exit 1; }

      - name: Guardar cambios en datos
        if: always() && steps.registro.outputs.hecho != 'si'
        working-directory: datos
        run: |
          git config user.name "Adentro Bot"
          git config user.email "bot@users.noreply.github.com"
          for p in cerebro-adentro cola registro "produccion/*/guion.json" "produccion/*/clips.json" "produccion/*/entrega/*.json"; do git add $p 2>/dev/null || true; done
          git diff --cached --quiet || { git commit -qm "Franja $FRANJA: $(date +%F)"; git pull -q --rebase --autostash && git push -q; }
